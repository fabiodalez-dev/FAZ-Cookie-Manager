name: "Plugin Check"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin-check:
    name: Plugin Check (wp.org shape)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Build a wp.org-shape copy (mirrors scripts/build-release.sh).
      # Excludes run-scan.php because Plugin Check cannot parse its CLI
      # ABSPATH guard, and the file is excluded from the wp.org ZIP anyway.
      - name: Build the actual wp.org release package
        run: |
          version="$(awk '/^Stable tag:/ {print $3; exit}' readme.txt)"
          bash scripts/build-release.sh --version="$version" --output-dir=/tmp/faz-release
          unzip -q "/tmp/faz-release/faz-cookie-manager-${version}.zip" -d /tmp

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20

      # NOTE: we intentionally do NOT use wordpress/plugin-check-action@v1.
      # That action auto-generates a .wp-env.json containing the
      # plugin-check zip as a URL `plugins` entry. On the GitHub
      # ubuntu-24.04 runner image from 2026-05-25 (Node 24.16 / libuv
      # 1.52.1), @wordpress/env's URL-source download path silently exits 0
      # without booting Docker, so the next step dies with "Environment not
      # initialized." (upstream: WordPress/plugin-check-action#579,
      # WordPress/gutenberg#78762). The documented workaround is to keep the
      # plugin-check zip OUT of .wp-env.json and install it via wp-cli after
      # wp-env start — which is what the two steps below do.
      - name: Provision wp-env (plugin-check installed post-boot, not as a URL plugin)
        run: |
          mkdir -p /tmp/faz-plugin-check-results
          cat > .wp-env.json <<'JSON'
          {
            "core": "WordPress/WordPress#7.1",
            "port": 8880,
            "testsPort": 8881,
            "testsEnvironment": false,
            "mappings": {
              "wp-content/plugins/faz-cookie-manager": "/tmp/faz-cookie-manager",
              "faz-plugin-check-results": "/tmp/faz-plugin-check-results"
            }
          }
          JSON
          # Pin both WordPress and @wordpress/env so the CI environment is
          # reproducible. WordPress 7.1 is the current final release and the
          # mirror tag is verified before this pin is advanced. Leaving core at
          # null can make an unrelated upstream tag/update change break the gate.
          # An unpinned @wordpress/env can introduce a boot regression (see #579)
          # without any change to the plugin under test.
          npm -g --no-fund i @wordpress/env@11.7.0
          wp-env start --update
          # wp-env can exit 0 without actually starting Docker (see #579) —
          # this turns that silent failure into a loud one.
          wp-env run cli wp cli info

      - name: Run Plugin Check
        run: |
          # Pin Plugin Check so a new release can't change the pass/fail
          # outcome of this gate without a deliberate version bump here.
          wp-env run cli sh -c 'wp plugin install plugin-check --version=1.9.0 --activate'
          wp-env run cli wp plugin activate faz-cookie-manager
          # Plugin Check can print ERROR findings and still exit 0. Write a
          # machine-readable result through a separate bind mount, then
          # independently reject errors, empty output or malformed results.
          wp-env run cli sh -c 'wp plugin check faz-cookie-manager --categories=plugin_repo --format=strict-json --fields=file,line,column,type,code,message > /var/www/html/faz-plugin-check-results/results.json'
          python3 scripts/check-plugin-check.py /tmp/faz-plugin-check-results/results.json

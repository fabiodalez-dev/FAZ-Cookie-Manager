name: "Quality"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality:
    name: Quality
    # Trusted jobs run in disposable VMs; fork PRs stay on GitHub-hosted runners.
    runs-on: ${{ fromJSON((github.actor == github.repository_owner || github.actor == 'dependabot[bot]') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","X64","fabio-ci"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Prepare disposable Linux runner
        if: runner.environment == 'self-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends default-mysql-client gh jq rsync gettext zip unzip shellcheck python3-venv

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext shellcheck
          npm ci
          composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax
        run: npm run lint:php

      - name: Shell syntax and static analysis
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      - name: Unit suites
        run: npm run test:unit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=2G

      - name: Generated JavaScript is current
        run: |
          npm run build:min
          git diff --exit-code -- frontend/js/*.min.js

      - name: Repository diff hygiene
        run: git diff --check HEAD^
